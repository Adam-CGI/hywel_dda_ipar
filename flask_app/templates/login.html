<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ brand_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nhs': {
                            'blue': '#005EB8',
                            'dark-blue': '#003087',
                            'bright-blue': '#0072CE',
                            'light-blue': '#41B6E6'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #005EB8 0%, #003087 100%);">
    
    <div class="w-full max-w-sm">
        <!-- Logo/Brand Section -->
        <div class="text-center mb-6">
            <div class="inline-block bg-white rounded-full p-4 shadow-lg">
                <i class="fas fa-hospital text-4xl" style="color: #005EB8;"></i>
            </div>
            <h1 class="text-white text-2xl font-bold mt-3">{{ brand_name }}</h1>
            <p class="text-blue-100 text-sm mt-1">{{ brand_tagline }}</p>
        </div>

        <!-- Login Card -->
        <div class="card">
            <div class="card-body">
                <!-- Error Message -->
                {% if error %}
                <div class="alert alert-error mb-4">
                    <div class="alert-icon">
                        <i class="fas fa-exclamation-circle"></i>
                    </div>
                    <div class="alert-content">
                        <p class="alert-message">{{ error }}</p>
                    </div>
                </div>
                {% endif %}

                <!-- Login Form -->
                <form method="POST" action="/login" class="space-y-4">
                    <!-- Username Field -->
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            required
                            autofocus
                            class="form-input"
                            placeholder="Enter your username"
                        >
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            class="form-input"
                            placeholder="Enter your password"
                        >
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-full">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Sign In
                    </button>
                </form>

                <!-- Footer Info -->
                <p class="text-center text-xs text-muted mt-4">
                    <i class="fas fa-lock mr-1"></i>
                    Authorised Access Only
                </p>
            </div>
        </div>

        <!-- Additional Info -->
        <p class="text-center text-white text-xs mt-4 opacity-75">
            For access issues, contact your system administrator
        </p>
    </div>

</body>
</html>
