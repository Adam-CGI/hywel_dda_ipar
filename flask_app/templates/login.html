<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ brand_name }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-center;
            padding: 1rem;
        }
        
        .container {
            width: 100%;
            max-width: 28rem;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .logo-circle {
            display: inline-block;
            background: white;
            border-radius: 50%;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .logo-icon {
            font-size: 4rem;
            color: #0ea5e9;
        }
        
        h1 {
            color: white;
            font-size: 1.875rem;
            font-weight: 700;
            margin-top: 1rem;
        }
        
        .tagline {
            color: #e0f2fe;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
        
        .login-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2rem;
        }
        
        .card-header {
            margin-bottom: 1.5rem;
        }
        
        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            display: flex;
            align-items: center;
        }
        
        h2 i {
            margin-right: 0.75rem;
            color: #0ea5e9;
        }
        
        .card-description {
            color: #4b5563;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
        
        .error-box {
            margin-bottom: 1.5rem;
            background-color: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 1rem;
            border-radius: 0.5rem;
        }
        
        .error-content {
            display: flex;
            align-items: center;
        }
        
        .error-icon {
            color: #ef4444;
            margin-right: 0.5rem;
        }
        
        .error-text {
            color: #b91c1c;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        
        label i {
            margin-right: 0.5rem;
            color: #9ca3af;
        }
        
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            font-weight: 700;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        button i {
            margin-right: 0.5rem;
        }
        
        .footer {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }
        
        .footer-text {
            text-align: center;
            font-size: 0.75rem;
            color: #6b7280;
        }
        
        .footer-text i {
            margin-right: 0.25rem;
        }
        
        .additional-info {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .info-text {
            color: white;
            font-size: 0.875rem;
            opacity: 0.75;
        }
        
        .info-text i {
            margin-right: 0.25rem;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-md">
        <!-- Logo/Brand Section -->
        <div class="text-center mb-8 float-animation">
            <div class="inline-block bg-white rounded-full p-6 shadow-2xl">
                <i class="fas fa-hospital text-6xl text-hywel-500"></i>
            </div>
            <h1 class="text-white text-3xl font-bold mt-4">{{ brand_name }}</h1>
            <p class="text-hywel-100 text-sm mt-2">{{ brand_tagline }}</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800 flex items-center">
                    <i class="fas fa-lock mr-3 text-hywel-500"></i>
                    Sign In
                </h2>
                <p class="text-gray-600 text-sm mt-2">Enter your credentials to access the document intelligence platform</p>
            </div>

            <!-- Error Message -->
            {% if error %}
            <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
                    <p class="text-red-700 text-sm font-medium">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="/login" class="space-y-6">
                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2 text-gray-400"></i>
                        Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        autofocus
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-hywel-500 focus:border-transparent transition-all duration-200"
                        placeholder="Enter your username"
                    >
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-key mr-2 text-gray-400"></i>
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-hywel-500 focus:border-transparent transition-all duration-200"
                        placeholder="Enter your password"
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-hywel-500 to-hywel-600 hover:from-hywel-600 hover:to-hywel-700 text-white font-bold py-3 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg hover:shadow-xl flex items-center justify-center"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Sign In
                </button>
            </form>

            <!-- Footer Info -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-center text-xs text-gray-500">
                    <i class="fas fa-shield-alt mr-1"></i>
                    Authorised Access Only
                </p>
            </div>
        </div>

        <!-- Additional Info -->
        <div class="text-center mt-6">
            <p class="text-white text-sm opacity-75">
                <i class="fas fa-info-circle mr-1"></i>
                For access issues, contact your system administrator
            </p>
        </div>
    </div>

</body>
</html>
