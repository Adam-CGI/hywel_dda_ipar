[pytest]
# Performance monitoring configuration for pytest

# Test execution settings
addopts = 
    --strict-markers
    --strict-config
    --durations=10
    --durations-min=0.01
    -ra

# Performance markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    performance: marks tests that measure performance
    integration: marks tests as integration tests
    system: marks tests as system/end-to-end tests
    unit: marks tests as unit tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings for performance monitoring
# (These complement the main pytest.ini)
addopts = 
    --cov-config=tests/pytest_performance.ini
    --cov-fail-under=80
    --cov-branch

# Performance thresholds (used by custom plugins)
performance_thresholds =
    unit_test_max_time = 0.1
    integration_test_max_time = 1.0
    system_test_max_time = 10.0
    total_suite_max_time = 300.0

# Timeout settings
timeout = 300
timeout_method = thread

# Parallel execution settings
# (Uncomment to enable parallel test execution)
# addopts = -n auto

# Memory monitoring
# (Requires pytest-monitor plugin)
# addopts = --monitor

# Benchmark settings
# (Requires pytest-benchmark plugin)
# addopts = --benchmark-only --benchmark-sort=mean