[pytest]
# Pytest configuration for Hywel Dda IPAR Document Miner Test Suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directory structure and test paths
testpaths = tests
norecursedirs = .git .tox htmlcov logs data scripts __pycache__ .venv

# Test markers for categorization
markers =
    unit: Unit tests for individual service components (fast, isolated)
    integration: Integration tests for multi-service workflows (moderate speed)
    system: System tests for end-to-end user workflows (slower, comprehensive)
    slow: Tests that take more than 1 second to run
    azure: Tests that require Azure services (skip in CI without credentials)
    mock: Tests using mocked dependencies (default for unit tests)
    real: Tests using real service implementations (integration/system only)
    chunking: Tests related to document chunking functionality
    embedding: Tests related to text embedding and vector operations
    search: Tests related to search and retrieval functionality
    chat: Tests related to RAG chat functionality
    storage: Tests related to blob storage operations
    cosmos: Tests related to Cosmos DB operations
    extraction: Tests related to document extraction and processing
    api: Tests for Flask API endpoints and routes

# Console output and formatting
console_output_style = progress
addopts =
    --verbose
    --strict-markers
    --strict-config
    --tb=short
    --showlocals
    --durations=10
    --color=yes
    --disable-warnings
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-branch
    --cov-fail-under=80
    --junit-xml=test-results.xml

# Logging configuration for tests
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeout settings (requires pytest-timeout plugin)
# timeout = 300
# timeout_method = thread

# Minimum Python version
minversion = 3.11

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:azure.*
    ignore::UserWarning:openai.*

# Coverage configuration
[coverage:run]
source = app
branch = true
parallel = true
omit =
    */tests/*
    */test_*
    */.venv/*
    */venv/*
    */__pycache__/*
    */site-packages/*
    */migrations/*
    */scripts/*
    app/config.py
    app/__init__.py

[coverage:paths]
source =
    app/
    */site-packages/app/

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = Cover
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
title = Hywel Dda IPAR Test Coverage Report

[coverage:xml]
output = coverage.xml
